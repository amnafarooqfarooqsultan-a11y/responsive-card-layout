<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card design</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <!--for parent and child container-->
    <div class="container1">

        <div class="container2"></div>

        <!--for text box-->
        <div class="textbox">

            <!--name-->
            <h2 class="name">AFSUN <span style="color: blue">&#10004;</span></h2>

            <!--bio-->
            <p class="bio">
                I create modern and responsive websites using HTML and CSS.
                I build attractive web layouts for businesses and personal projects.
            </p>

            <!--description-->
            <p class="rating">&starf;4.8 <br>Rating</p>

            <p class="earned">$50k+ <br> Earned</p>

            <p class="rate">$80/hr <br> Rate</p>

            <!--button-->
            <button>Get In Touch</button>

        </div>

    </div>

</body>
</html>
